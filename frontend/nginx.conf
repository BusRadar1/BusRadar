server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker DNS and refresh service addresses periodically.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Strip the API prefix and forward requests to the matching service.
    location ~ ^/api/(ingest|tracking|stats|trips)/(.*)$ {
        set $backend_service $1;
        set $backend_path $2;

        proxy_pass http://${backend_service}-service:8080/$backend_path$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow streaming responses without nginx buffering.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Return an error for unsupported API routes.
    location /api/ {
        return 404;
    }

    # Let Angular handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}